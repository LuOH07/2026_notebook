name: Deploy wiki to GitHub Pages

# GitHub equivalent of .gitlab-ci.yml: build the Flask/Frozen-Flask wiki and
# publish the frozen output (public/) with GitHub Pages.
#
# One-time setup: repository Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions" (instead of "Deploy from a branch"). While the
# source is still a branch, GitHub runs its own Jekyll build and the deploy
# step of this workflow will fail because Pages is not configured for Actions.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages deployments at once; let a running one finish.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned dependencies
        run: python -m pip install --no-cache-dir -r dependencies.txt

      - name: Freeze the site to public/
        # app.py only writes to public/ when the publish switch is on; GitLab
        # sets GITLAB_CI itself, so it is set explicitly here. The asset map is
        # validated against static.igem.wiki during the build.
        env:
          FLASK_APP: app.py
          GITLAB_CI: "true"
        run: python -m flask freeze

      - name: Give the pages a .html extension
        # GitHub Pages derives Content-Type from the file extension: the
        # extensionless files Frozen-Flask writes for /members, /notebook, ...
        # were served as application/octet-stream, so the browser downloaded
        # them instead of rendering them (GitLab Pages serves them as HTML,
        # which is why the same build works there).
        #
        # GitHub Pages resolves the URL /members to the file members.html and
        # returns text/html, so renaming the frozen page files is enough — the
        # relative links inside the pages, the URLs and every page's content
        # stay exactly the same. Only the top level holds page files; static/
        # already uses real extensions.
        run: |
          set -euo pipefail
          find public -maxdepth 1 -type f ! -name '*.*' -print0 |
            while IFS= read -r -d '' file; do
              mv "$file" "$file.html"
            done
          echo "Extensionless files left in public/: $(find public -maxdepth 1 -type f ! -name '*.*' | wc -l)"
          ls public

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the frozen site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
